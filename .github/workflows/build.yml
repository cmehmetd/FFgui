name: Derle ve Yayınla

# Etiket gönderilince (örn. v1.0.0) derler ve dosyaları Releases'e ekler.
# Actions sekmesinden elle de çalıştırılabilir (sürüm yayınlanmaz).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıkları kur
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libgl1-mesa-dev libegl1-mesa-dev cmake g++ file wget

      - name: Derle
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel

      - name: AppImage oluştur
        run: |
          export QMAKE="$(which qmake6)"
          DESTDIR="$PWD/AppDir" cmake --install build
          cat > FFgui.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=FFgui
          Comment=Qt ile yazilmis basit FFmpeg arayuzu
          Exec=FFgui
          Icon=FFgui
          Categories=AudioVideo;Video;
          Terminal=false
          StartupWMClass=FFgui
          EOF
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            -d FFgui.desktop \
            -i src/FFgui.png \
            --plugin qt \
            --output appimage
          mv FFgui-*.AppImage FFgui-x86_64.AppImage

      - name: Yapıtı yükle
        uses: actions/upload-artifact@v4
        with:
          name: FFgui-Linux-AppImage
          path: FFgui-x86_64.AppImage

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt kur
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64

      - name: MSVC ortamını hazırla
        uses: ilammy/msvc-dev-cmd@v1

      - name: Derle
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel

      - name: DLL'leri topla ve zip'le
        run: |
          windeployqt --release build\Release\FFgui.exe
          Compress-Archive -Path build\Release\* -DestinationPath FFgui-Windows-x86_64.zip

      - name: Yapıtı yükle
        uses: actions/upload-artifact@v4
        with:
          name: FFgui-Windows-zip
          path: FFgui-Windows-x86_64.zip

  release:
    needs: [linux-appimage, windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Sürümü yayınla
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
